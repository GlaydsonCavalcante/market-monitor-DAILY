name: DAILY - Monitoramento de Mercado Multirregional

on:
  schedule:
    # Execução diária regular às 06:00 UTC (03:00 Horário de Brasília)
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  TZ: "America/Sao_Paulo"

jobs: 
  executar-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard:
          - latam_fintechs
          - latam_plataformas
          - latam_tendencias
          - anglo_fintechs
          - anglo_plataformas
          - anglo_tendencias
          - europa
          - asia_cn_sg
          - asia_jp_kr
          - mea_india

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Liberar espaco em disco no Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Removido cache: 'pip' para expurgar o cache legado de 3.3GB do PyTorch

      - name: Instalar dependencias e Navegador Headless
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt rapidfuzz
          playwright install chromium
          playwright install-deps chromium
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Configurar Rclone em Memoria para Acesso ao Drive (Configuracoes)
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          ID_CONFIGS: ${{ secrets.GDRIVE_CONFIG_FOLDER_ID }}
        run: |
          python3 -c '
          import os, json, base64
          raw = os.environ.get("GDRIVE_SA_KEY", "").strip()
          try:
              # Tentativa 1: Trata como JSON direto
              data = json.loads(raw)
          except Exception:
              try:
                  # Tentativa 2: Trata como Base64
                  decoded = base64.b64decode(raw).decode("utf-8", errors="ignore")
                  data = json.loads(decoded)
              except Exception as exc:
                  raise ValueError(f"Secret GDRIVE_SA_KEY não é um JSON nem Base64 válido: {exc}")

          with open("/tmp/gdrive_sa.json", "w", encoding="utf-8") as f:
              json.dump(data, f)
          '

          CLEAN_CONFIGS=$(echo "$ID_CONFIGS" | grep -oE '[a-zA-Z0-9_-]{25,}' | head -n 1)
          if [ -z "$CLEAN_CONFIGS" ]; then CLEAN_CONFIGS="$ID_CONFIGS"; fi

          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive_config]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive_sa.json
          root_folder_id = $CLEAN_CONFIGS
          include_shared_with_me = true
          EOF

      - name: Executar Pipeline Diario do Shard [${{ matrix.shard }}]
        env:
          PYTHONUNBUFFERED: "1"
          SHARD_NAME: ${{ matrix.shard }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --shard ${{ matrix.shard }}

      - name: Preservar JSON em Artifacts do GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticias-${{ matrix.shard }}
          path: noticias_${{ matrix.shard }}_*.json
          retention-days: 7

      - name: Expurgo de Credenciais Temporarias
        if: always()
        run: rm -rf /tmp/gdrive_sa.json ~/.config/rclone/rclone.conf
