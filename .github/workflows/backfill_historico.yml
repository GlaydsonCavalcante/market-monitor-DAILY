name: DAILY - Monitoramento de Mercado Multirregional

on:
  schedule:
    - cron: '15 9 * * *' # 09:30 UTC = 06:30 BRT
  workflow_dispatch:

env:
  TZ: "America/Sao_Paulo"

jobs:
  coletar-rss-shards:
    name: Coletar RSS [${{ matrix.shard }}]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - latam_fintechs
          - latam_plataformas
          - latam_tendencias
          - anglo_fintechs
          - anglo_plataformas
          - anglo_tendencias
          - europa
          - asia_cn_sg
          - asia_jp_kr
          - mea_india

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias para Coleta
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Configurar Rclone em Memoria para Acesso ao Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          ID_CONFIGS: ${{ secrets.GDRIVE_CONFIG_FOLDER_ID }}
        run: |
          python3 -c '
          import os, json, base64
          raw = os.environ.get("GDRIVE_SA_KEY", "").strip()
          try:
              data = json.loads(raw)
          except Exception:
              try:
                  decoded = base64.b64decode(raw).decode("utf-8", errors="ignore")
                  data = json.loads(decoded)
              except Exception as exc:
                  raise ValueError(f"Secret GDRIVE_SA_KEY não é um JSON nem Base64 válido: {exc}")

          with open("/tmp/gdrive_sa.json", "w", encoding="utf-8") as f:
              json.dump(data, f)
          '

          CLEAN_CONFIGS=$(echo "$ID_CONFIGS" | grep -oE '[a-zA-Z0-9_-]{25,}' | head -n 1)
          if [ -z "$CLEAN_CONFIGS" ]; then CLEAN_CONFIGS="$ID_CONFIGS"; fi

          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive_config]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive_sa.json
          root_folder_id = $CLEAN_CONFIGS
          include_shared_with_me = true
          EOF

      - name: Executar Varredura RSS do Shard
        env:
          PYTHONUNBUFFERED: "1"
          SHARD_NAME: ${{ matrix.shard }}
        run: python main.py --shard ${{ matrix.shard }} --coletar-apenas

      - name: Preservar Raw JSON do Shard
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.shard }}
          path: raw_${{ matrix.shard }}.json
          retention-days: 1

      - name: Expurgo de Credenciais Temporarias
        if: always()
        run: rm -rf /tmp/gdrive_sa.json ~/.config/rclone/rclone.conf

      - name: Notificar Falha na Coleta RSS
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RAW_TOKEN="${TELEGRAM_BOT_TOKEN#bot}"
          MENSAGEM="🚨 <b>FALHA NA COLETA RSS</b>%0A%0A"
          MENSAGEM+="📁 <b>Shard:</b> ${{ matrix.shard }}%0A"
          MENSAGEM+="🔗 <a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">Acessar Log no GitHub Actions</a>"

          IFS=',' read -ra CHATS <<< "$TELEGRAM_CHAT_ID"
          for CHAT in "${CHATS[@]}"; do
            CLEAN_CHAT=$(echo "$CHAT" | xargs)
            curl -s -X POST "https://api.telegram.org/bot${RAW_TOKEN}/sendMessage" \
              -d "chat_id=${CLEAN_CHAT}" \
              -d "text=${MENSAGEM}" \
              -d "parse_mode=HTML" > /dev/null
          done

  consolidar-e-extrair:
    name: Consolidacao Semantica Global e Extracao
    needs: coletar-rss-shards
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache do Modelo FastEmbed
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-paraphrase-multilingual-v1

      - name: Instalar dependencias e Navegador Headless
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          playwright install chromium

      - name: Baixar todos os metadados brutos dos shards
        uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          merge-multiple: true

      - name: Executar Consolidacao Global e Extracao
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --consolidar-global

      - name: Preservar JSON Consolidado em Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticias-consolidado-diario
          path: noticias_consolidado_*.json
          retention-days: 7

      - name: Notificar Falha no Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RAW_TOKEN="${TELEGRAM_BOT_TOKEN#bot}"
          MENSAGEM="🚨 <b>FALHA NO MONITORAMENTO DIÁRIO. ACIONE O TIME DE IA & ANALYTICS</b>%0A%0A"
          MENSAGEM+="⚙️ <b>Etapa:</b> ${{ matrix.shard || 'Consolidacao Global' }}%0A"
          MENSAGEM+="🔗 <a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">Ver Detalhes da Execução</a>"

          IFS=',' read -ra CHATS <<< "$TELEGRAM_CHAT_ID"
          for CHAT in "${CHATS[@]}"; do
            CLEAN_CHAT=$(echo "$CHAT" | xargs)
            curl -s -X POST "https://api.telegram.org/bot${RAW_TOKEN}/sendMessage" \
              -d "chat_id=${CLEAN_CHAT}" \
              -d "text=${MENSAGEM}" \
              -d "parse_mode=HTML" > /dev/null
          done
